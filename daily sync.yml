name: Daily ATP Data Sync

on:
  schedule:
    - cron: '0 6 * * *'  # Runs every day at 6am UTC (after Sackmann's nightly update)
  workflow_dispatch:       # Also allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas supabase tqdm

      - name: Clone Sackmann data
        run: git clone --depth=1 https://github.com/JeffSackmann/tennis_atp.git

      - name: Run sync script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_atp.py
